# Every push to main updates one release PR (version.txt and CHANGELOG.md from the feat:/fix:
# commits since the last release). Merging it tags vX.Y.Z and makes the GitHub Release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
